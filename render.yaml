services:
  - type: web
    name: secondchair
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate
    startCommand: gunicorn secondchair.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: DJANGO_SETTINGS_MODULE
        value: secondchair.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        # Left empty on purpose: production settings append
        # RENDER_EXTERNAL_HOSTNAME, which Render injects at runtime. Set this
        # to a comma-separated list only when adding a custom domain.
        value: ""
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: secondchair-db
          property: connectionString

databases:
  - name: secondchair-db
    databaseName: secondchair
    plan: free
    region: oregon
