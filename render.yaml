# Render blueprint for the site: a Django API, a React static site, and a
# Postgres instance. Render only reads render.yaml from the repository root,
# which is why this file sits here rather than in backend/.
#
# After the first deploy, set ANTHROPIC_API_KEY on the API service. Every
# other value below is either generated or wired between services.

databases:
  - name: cd-site-db
    databaseName: cd_site
    user: cd_site
    plan: basic-256mb

services:
  - type: web
    name: cd-site-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 90
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: DATABASE_URL
        fromDatabase:
          name: cd-site-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      # RENDER_EXTERNAL_HOSTNAME is appended to ALLOWED_HOSTS automatically.
      # Add a custom domain here once one is attached.
      - key: ALLOWED_HOSTS
        value: ""
      # Render exposes a service's hostname, not its full URL. Settings
      # prefixes https:// to any origin that arrives without a scheme.
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: cd-site-web
          # "web", not "static": the site is declared as type web with
          # runtime static, and fromService matches on the declared type.
          type: web
          property: host
      # The custom domain the site answers on. Merged into CORS_ALLOWED_ORIGINS
      # alongside the wired onrender.com hostname above, which keeps working.
      - key: SITE_ORIGINS
        value: corydegarmo.com,www.corydegarmo.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: CONTACT_EMAIL
        value: degarmo@gmail.com
      # Spoken answers. Leave unset and the site simply never offers to
      # speak; set both to turn the play buttons on.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false

  - type: web
    name: cd-site-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    # Apex is primary; Render redirects www to it and issues certificates for
    # both. DNS for these lives at Network Solutions - see the README.
    domains:
      - corydegarmo.com
      - www.corydegarmo.com
    envVars:
      # Hostname only, for the same reason. api.ts prefixes https:// when
      # the value arrives without a scheme.
      - key: VITE_API_BASE_URL
        fromService:
          name: cd-site-api
          type: web
          property: host
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
