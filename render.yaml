services:
  - type: web
    name: secondchair
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: uv run gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: secondchair-db
          property: connectionString

databases:
  - name: secondchair-db
    plan: free
