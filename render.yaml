# Render blueprint for the site: a Django API, a React static site, and a
# Postgres instance. Render only reads render.yaml from the repository root,
# which is why this file sits here rather than in backend/.
#
# After the first deploy, set ANTHROPIC_API_KEY on the API service. Every
# other value below is either generated or wired between services.

databases:
  - name: cd-site-db
    databaseName: cd_site
    user: cd_site
    plan: basic-256mb

services:
  - type: web
    name: cd-site-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 90
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: DATABASE_URL
        fromDatabase:
          name: cd-site-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      # RENDER_EXTERNAL_HOSTNAME is appended to ALLOWED_HOSTS automatically.
      # Add a custom domain here once one is attached.
      - key: ALLOWED_HOSTS
        value: ""
      # Written out rather than wired. Render has no blueprint property for a
      # service's *public* URL: fromService `host` returns the internal name
      # ("cd-site-web") used for service-to-service calls inside Render's
      # network, which a browser cannot resolve. The onrender.com origin stays
      # listed so the site keeps working there as well as on the domain.
      - key: CORS_ALLOWED_ORIGINS
        value: https://corydegarmo.com,https://www.corydegarmo.com,https://cd-site-web.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: CONTACT_EMAIL
        value: degarmo@gmail.com
      # Spoken answers. Leave unset and the site simply never offers to
      # speak; set both to turn the play buttons on.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false

  - type: web
    name: cd-site-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    # Apex is primary; Render redirects www to it and issues certificates for
    # both. DNS for these lives at Network Solutions - see the README.
    domains:
      - corydegarmo.com
      - www.corydegarmo.com
    envVars:
      # Written out for the same reason. `host` here resolved to the literal
      # "cd-site-api", so the browser requested https://cd-site-api/ and every
      # call failed. This is baked in at build time, so changing it needs a
      # rebuild of the static site, not just a restart.
      - key: VITE_API_BASE_URL
        value: https://cd-site-api.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
